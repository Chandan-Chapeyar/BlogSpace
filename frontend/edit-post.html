
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Blog Post | BlogSpace</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a href="index.html" class="logo">
                Blog<span>Space.</span>
            </a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
            </div>

            <div class="nav-actions" id="navActions"></div>
        </nav>
    </header>

    <main class="container editor-section">

        <section class="editor-card">

            <span class="eyebrow">UPDATE YOUR CONTENT</span>

            <h1>Edit Blog Post</h1>

            <p class="editor-description">
                Make changes to your existing blog article.
            </p>

            <form id="editPostForm">

                <div class="form-group">
                    <label for="title">Blog Title</label>

                    <input
                        type="text"
                        id="title"
                        minlength="3"
                        maxlength="120"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="content">Blog Content</label>

                    <textarea
                        id="content"
                        maxlength="20000"
                        required
                    ></textarea>
                </div>

                <div class="editor-actions">

                    <a href="dashboard.html" class="btn btn-outline">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="updateButton"
                    >
                        Save Changes
                    </button>

                </div>

                <p id="editPostMessage"
                   class="form-message"
                   role="status"
                   aria-live="polite">
                </p>

            </form>

        </section>

    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/edit-post.js"></script>

</body>
</html>
