
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your BlogSpace account.">
    <title>Login | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar container">
            <a href="index.html" class="logo">Blog<span>Space.</span></a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#blogs">Explore</a>
            </div>

            <div class="nav-actions" id="navActions">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="register.html" class="btn btn-primary">Get Started</a>
            </div>
        </nav>
    </header>

    <main class="auth-section">
        <section class="auth-card">
            <span class="eyebrow">WELCOME BACK</span>
            <h1>Login to BlogSpace</h1>
            <p>Sign in to continue sharing and discovering ideas.</p>

            <form id="loginForm" method="post">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="loginButton">
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>

            <p class="form-footer">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <a href="index.html" class="logo">Blog<span>Space.</span></a>
            <p>© <span id="currentYear"></span> BlogSpace.</p>
        </div>
    </footer>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
