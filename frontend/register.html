
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your BlogSpace account.">
    <title>Create Account | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar container">
            <a href="index.html" class="logo">Blog<span>Space.</span></a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#blogs">Explore</a>
            </div>

            <div class="nav-actions" id="navActions">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="register.html" class="btn btn-primary">Get Started</a>
            </div>
        </nav>
    </header>

    <main class="auth-section">
        <section class="auth-card">
            <span class="eyebrow">JOIN OUR COMMUNITY</span>
            <h1>Create your account</h1>
            <p>Start sharing your ideas with the BlogSpace community.</p>

            <form id="registerForm" method="post">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        minlength="2"
                        maxlength="60"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="registerButton">
                    Create Account
                </button>

                <p
                    id="registerMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>

            <p class="form-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <a href="index.html" class="logo">Blog<span>Space.</span></a>
            <p>© <span id="currentYear"></span> BlogSpace.</p>
        </div>
    </footer>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
